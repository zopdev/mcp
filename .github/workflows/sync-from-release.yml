name: Sync from mcp-server release

# Driven by the private zopnight repo, which dispatches here on each release
# that changed backend/mcp-server (see its publish-mcp job in deploy.yml).
#
# Push, not pull: this public repo cannot read the private one, so the tool
# table arrives in the dispatch payload rather than being fetched.
#
# This workflow does NOT publish to the MCP registry. That happens on the
# private side, so the registry signing key — which can overwrite anything under
# the dev.zop namespace — never has to live in a public repository where forked
# pull requests run workflows.
on:
  repository_dispatch:
    types: [mcp-release]
  workflow_dispatch:
    inputs:
      version:
        description: Version to write into server.json (e.g. 1.3.0)
        required: true

permissions:
  contents: write

# Two dispatches landing together would both commit off the same base and the
# second push would be rejected as non-fast-forward. Serialise instead.
#
# `cancel-in-progress: false` because each run carries a DIFFERENT version, so
# cancelling one loses that sync rather than superseding it. `true` would be
# strictly worse here.
#
# NOT a complete guarantee, and deliberately not claimed as one: GitHub keeps
# only ONE pending run per concurrency group, so a burst of three or more
# dispatches can still evict the middle one. Recovery is a manual
# `workflow_dispatch` for the dropped version — which updates server.json but
# not the tool table, so the table catches up on the next real release.
concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      TOOL_TABLE: ${{ github.event.client_payload.tool_table }}
      SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate the payload
        run: |
          set -euo pipefail

          # Bare semver only, and no leading zeros (semver §9 forbids them).
          # The registry sorts semantically and marks an UNPARSEABLE version as
          # "latest" regardless of order, so a malformed string here would
          # outrank every real release — permanently, since published versions
          # cannot be edited or deleted.
          #
          # No `>&2`: GitHub parses workflow commands from stdout only, so a
          # redirected ::error:: renders as plain log text instead of an
          # annotation.
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version '${VERSION}' is not bare semver (x.y.z)"
            exit 1
          fi

          # The tool table is written verbatim into a PUBLIC README on the
          # default branch, unreviewed. Today it is inert — the generator emits
          # integers and hardcoded category labels, and the manifest it reads
          # carries no free text (descriptions are deliberately excluded from
          # it) — so nothing attacker-influenced can reach here. These checks
          # exist for the day that stops being true, because by then the change
          # would be in the OTHER repo and nobody would think to re-audit this
          # one.
          #
          # Not a sanitiser, and not pretending to be: GitHub's Markdown
          # renderer already strips event-handler attributes, so the realistic
          # worst case is defacement of a git-tracked file, not script
          # execution. This bounds the size and refuses raw HTML outright, which
          # is cheap and unambiguous for content that should only ever be a
          # Markdown table.
          if [[ -n "${TOOL_TABLE}" ]]; then
            # `wc -c`, not `${#TOOL_TABLE}`: the latter counts CHARACTERS, so a
            # multi-byte payload could be twice the stated cap and still pass.
            TABLE_BYTES=$(printf '%s' "${TOOL_TABLE}" | wc -c | tr -d ' ')
            if (( TABLE_BYTES > 65536 )); then
              echo "::error::tool_table is ${TABLE_BYTES} bytes, over the 64 KiB cap"
              exit 1
            fi
            if grep -q '<' <<< "${TOOL_TABLE}"; then
              echo "::error::tool_table contains '<' — expected a Markdown table, refusing to write raw HTML to a public README"
              exit 1
            fi
          fi

      - name: Update server.json version
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp
          mv server.tmp server.json

      # Rewritten between markers rather than patched in place: the table's shape
      # changes when a tool category is added, so a line-oriented edit would
      # silently drop the new row.
      # Skipped on a manual `workflow_dispatch`, which supplies only a version:
      # the tool table can ONLY arrive by dispatch from the private repo, so
      # there is nothing to write and leaving it untouched is correct. The step
      # below says so, because a silently skipped step reads like a bug.
      - name: Note that the tool table was left unchanged
        if: env.TOOL_TABLE == ''
        run: |
          echo "::notice::No tool_table in the payload (manual dispatch?) — server.json version updated, README tool table left unchanged."

      - name: Update the tool table in README
        if: env.TOOL_TABLE != ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          table = os.environ["TOOL_TABLE"].strip()
          readme = open("README.md", encoding="utf-8").read()

          start = "<!-- TOOLS:START"
          end = "<!-- TOOLS:END -->"
          i, j = readme.find(start), readme.find(end)
          if i == -1 or j == -1:
              raise SystemExit("TOOLS:START/END markers missing from README.md")

          # Keep the START comment line itself (it carries the do-not-edit note).
          head_end = readme.index("-->", i) + len("-->")
          readme = readme[:head_end] + "\n\n" + table + "\n\n" + readme[j:]

          # The summary table near the top repeats the totals. Derive them from
          # the generated table's Total row so the two can never disagree.
          m = re.search(r"\|\s*\*\*Total\*\*\s*\|\s*\*\*(\d+)\*\*\s*\|\s*\*\*(\d+)\*\*\s*\|\s*\*\*(\d+)\*\*", table)
          if not m:
              raise SystemExit("could not read the Total row from the tool table")
          total, read, write = m.groups()
          readme, n = re.subn(
              r"(\|\s*\*\*Tools\*\*\s*\|\s*)[^|]*(\|)",
              rf"\g<1>{total} — {read} read, {write} write \g<2>",
              readme,
              count=1,
          )
          if n != 1:
              raise SystemExit("could not update the Tools row in the summary table")

          open("README.md", "w", encoding="utf-8").write(readme)
          print(f"tool table updated: {total} tools ({read} read, {write} write)")
          PY

      - name: Commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "zopdev-bot"
          git config user.email "noreply@zop.dev"
          git add README.md server.json
          git commit -m "chore: sync mcp-server ${VERSION}${SOURCE_SHA:+ (${SOURCE_SHA})}"
          git push
